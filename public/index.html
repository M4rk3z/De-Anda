<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index De Anda</title>
    <link rel="stylesheet" href="styles.css">
  </head>

      <header class="topbar">

          <span class="brand-title">Index</span>
          <span class="brand-subtitle">De Anda</span>
        </div>
      </header>

      <div class="main-layout">
        <aside class="sidebar">
          <button class="menu-toggle" onclick="toggleSidebar()" aria-label="Abrir menu">☰</button>
          <nav id="sideMenu" class="side-menu open">
            <button onclick="showSection('inicio')">Inicio</button>
            <button onclick="showSection('visualizador')">Visualizador</button>
            <button onclick="showSection('nuevoCodigo')">Nuevo Codigo</button>
            <button onclick="showSection('panelControl')">Panel de control</button>
            <button onclick="showSection('Manual')">Manual</button>
          </nav>
        </aside>

        <main class="content">
          <section id="viewer" class="viewer">
            <h2>Bienvenido</h2>
            <p>Aqui se mostrara el contenido del modulo seleccionado.</p>
          </section>
        </main>
      </div>
    </div>

    <script src="scripts.js"></script>
  </body>
</html>
